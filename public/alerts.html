<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alerts — Wireshark AI</title>
  <link rel="stylesheet" href="assets.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <header class="top">
        <div>
          <div class="crumb">WIRESHARK AI / INCIDENTS</div>
          <h1 class="title">Alerts</h1>
          <div class="subline">Рабочая очередь аналитика: severity, источник, действие.</div>
        </div>
        <div class="topActions">
          <span class="clock" id="clock"></span>
          <button class="btn primary" id="ackAll">ACK ALL</button>
        </div>
      </header>

      <section class="grid stats">
        <div class="card stat">
          <div class="label">Open alerts</div>
          <div class="value danger" id="open">7</div>
          <div class="delta">2 new</div>
        </div>
        <div class="card stat">
          <div class="label">Critical</div>
          <div class="value danger" id="crit">2</div>
          <div class="delta">priority review</div>
        </div>
        <div class="card stat">
          <div class="label">Warning</div>
          <div class="value warn" id="med">5</div>
          <div class="delta">monitor</div>
        </div>
        <div class="card stat">
          <div class="label">Resolved today</div>
          <div class="value safe">18</div>
          <div class="delta">local demo queue</div>
        </div>
      </section>

      <div class="sectionGap"></div>

      <section class="card">
        <div class="cardHead">
          <h3>Security alerts</h3>
          <div class="tabs">
            <button class="tab active" data-tab="all">ALL</button>
            <button class="tab" data-tab="critical">CRITICAL</button>
            <button class="tab" data-tab="warning">WARNING</button>
          </div>
        </div>

        <div class="tableWrap">
          <table class="table">
            <thead>
              <tr>
                <th>Severity</th>
                <th>Event</th>
                <th>Source</th>
                <th>Destination</th>
                <th>Detected</th>
                <th>Owner</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="alerts"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div class="drawerShade" id="drawerShade"></div>
  <aside class="drawer" id="drawer"></aside>
  <div class="toast" id="toast"></div>

  <script src="layout.js"></script>
  <script src="app.js"></script>
  <script src="alerts.js"></script>
</body>
</html>
