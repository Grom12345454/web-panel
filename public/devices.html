<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Devices — Wireshark AI</title>
  <link rel="stylesheet" href="assets.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <header class="top">
        <div>
          <div class="crumb">WIRESHARK AI / ASSETS</div>
          <h1 class="title">Devices</h1>
          <div class="subline">Инвентарь endpoint-ов, статус и наблюдаемая активность.</div>
        </div>
        <div class="topActions">
          <span class="clock" id="clock"></span>
          <button class="btn" data-toast="Инвентарь обновлён">REFRESH</button>
        </div>
      </header>

      <section class="card">
        <div class="cardHead">
          <h3>Device inventory</h3>
          <div class="tabs">
            <button class="tab active" data-filter="all">ALL</button>
            <button class="tab" data-filter="safe">ONLINE</button>
            <button class="tab" data-filter="warning">WATCH</button>
            <button class="tab" data-filter="critical">ISOLATED</button>
          </div>
        </div>

        <div class="tableWrap">
          <table class="table">
            <thead>
              <tr>
                <th>Device</th>
                <th>IP</th>
                <th>Segment</th>
                <th>Last seen</th>
                <th>Traffic</th>
                <th>Risk</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="devicesTable"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div class="drawerShade" id="drawerShade"></div>
  <aside class="drawer" id="drawer"></aside>
  <div class="toast" id="toast"></div>

  <script src="layout.js"></script>
  <script src="app.js"></script>
  <script src="devices.js"></script>
</body>
</html>
