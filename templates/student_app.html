<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>University Control · Кабинет студента</title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<style>
:root{--bg:#07101d;--card:rgba(16,31,52,.86);--line:rgba(255,255,255,.10);--text:#f7fbff;--muted:#96a9c2;--a:#64a6ff;--b:#9b8cff;--ok:#49d39a;}
*{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 20% 0%,rgba(100,166,255,.25),transparent 32%),radial-gradient(circle at 90% 10%,rgba(155,140,255,.20),transparent 30%),linear-gradient(160deg,#050b14,#091729 55%,#06111e);padding:calc(14px + env(safe-area-inset-top)) 14px calc(22px + env(safe-area-inset-bottom));}
.wrap{max-width:720px;margin:0 auto}.hero3d{position:relative;overflow:hidden;padding:22px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,rgba(21,42,68,.92),rgba(10,20,35,.82));box-shadow:0 24px 70px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.12);transform:perspective(900px) rotateX(1deg)}.hero3d:after{content:"";position:absolute;width:220px;height:220px;right:-100px;top:-110px;border-radius:50%;background:radial-gradient(circle,rgba(100,166,255,.36),transparent 70%)}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8aa0bc;font-weight:800}.title{font-size:30px;line-height:1.02;letter-spacing:-.04em;margin:6px 0}.muted{color:var(--muted);line-height:1.5}.pill{display:inline-flex;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.045);font-size:12px}.grid{display:grid;gap:12px;margin-top:14px}.card{border:1px solid var(--line);border-radius:22px;background:var(--card);backdrop-filter:blur(18px);box-shadow:0 18px 44px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.06);padding:16px}.card h3{margin:0 0 6px;font-size:17px}.status{display:flex;align-items:center;justify-content:space-between;gap:12px}.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 18px var(--ok)}.row{display:flex;gap:10px;align-items:center}.icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(100,166,255,.22),rgba(155,140,255,.18));border:1px solid var(--line);font-size:20px}.link{display:inline-flex;margin-top:9px;padding:9px 11px;border-radius:12px;background:rgba(100,166,255,.10);border:1px solid rgba(100,166,255,.18);color:#d9eaff}.badge{font-size:11px;padding:6px 8px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line)}.err{padding:14px;border-radius:16px;background:rgba(255,100,120,.08);border:1px solid rgba(255,100,120,.2);color:#ffb1bd}.loading{padding:22px;text-align:center;color:var(--muted)}
</style></head>
<body><div class="wrap" id="app"><div class="loading">Загружаем кабинет студента…</div></div>
<script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
async function load(){
 const initData=tg?.initData||''; const app=document.getElementById('app');
 if(!initData){app.innerHTML='<div class="err">Откройте кабинет из Telegram-бота.</div>';return}
 try{const r=await fetch('/student-app/api/me',{headers:{'X-Telegram-Init-Data':initData}});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка'); render(d)}catch(e){app.innerHTML='<div class="err">'+escapeHtml(e.message)+'</div>'}
}
function render(d){const s=d.student; let dirs=d.directions.map(x=>`<div class="card"><div class="status"><div class="row"><div class="icon">${x.icon||'✦'}</div><div><h3>${escapeHtml(x.name)}</h3><div class="muted">Статус: ${status(x.status)}</div></div></div><span class="badge">${x.status}</span></div>${x.invites?.map(i=>`<a class="link" target="_blank" href="${escapeAttr(i.link)}">🔗 ${escapeHtml(i.title)}</a>`).join('')||''}</div>`).join('')||empty('Направления пока не выбраны.');
 let events=d.events.map(x=>`<div class="card"><h3>📅 ${escapeHtml(x.title)}</h3><div class="muted">${escapeHtml(x.location||'Место уточняется')} · ${escapeHtml(x.time||'Время уточняется')}</div><div style="margin-top:10px">${x.days.map(y=>`<span class="pill">${y.date} · свободно ${y.places}</span>`).join(' ')}</div></div>`).join('')||empty('Нет ближайших мероприятий.');
 let lessons=d.lessons.map(x=>`<div class="card"><h3>📚 ${escapeHtml(x.title)}</h3><div class="muted">${x.date} · ${x.time}${x.room?' · '+escapeHtml(x.room):''}</div>${x.teacher?`<div class="muted">Преподаватель: ${escapeHtml(x.teacher)}</div>`:''}</div>`).join('')||empty('Нет ближайших занятий.');
 document.getElementById('app').innerHTML=`<section class="hero3d"><div class="eyebrow">UNIVERSITY CONTROL / STUDENT</div><div class="title">${escapeHtml(s.full_name)}</div><div class="muted">${s.education_label} · ${escapeHtml(s.group||'Группа не указана')}</div><div style="display:flex;gap:8px;margin-top:14px;align-items:center"><span class="dot"></span><span class="pill">${escapeHtml(d.overall.label)}</span></div></section><div class="grid"><div><div class="eyebrow">МОЙ ПРОФИЛЬ</div><div class="card"><div class="muted">Телефон</div><div style="font-weight:700;margin-top:3px">${escapeHtml(s.phone||'—')}</div></div></div><div><div class="eyebrow">НАПРАВЛЕНИЯ</div>${dirs}</div><div><div class="eyebrow">МЕРОПРИЯТИЯ</div>${events}</div><div><div class="eyebrow">ЗАНЯТИЯ</div>${lessons}</div></div>`}
function status(x){return({active:'Активен',approved:'Одобрен',pending:'На рассмотрении',interview:'Собеседование',rejected:'Отклонён'}[x]||x)}function empty(x){return `<div class="card muted">${x}</div>`}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(v){return escapeHtml(v)}load();
</script></body></html>
