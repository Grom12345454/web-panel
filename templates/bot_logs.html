{% extends "base.html" %}
{% block title %}Логи бота | University{% endblock %}
{% block content %}
<div class="p-6 max-w-7xl mx-auto space-y-8">
    
    <div class="flex justify-between items-center">
        <h1 class="text-3xl font-bold text-slate-800">Логи Telegram бота</h1>
        <a href="{{ url_for('admin.dashboard') }}" class="bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-lg transition">← Назад</a>
    </div>

    <div class="bg-slate-900 rounded-2xl shadow-lg overflow-hidden">
        <div class="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
            <span class="text-slate-300 font-mono text-sm">Последние 100 записей</span>
            <button onclick="location.reload()" class="text-slate-400 hover:text-white text-sm transition">
                 Обновить
            </button>
        </div>
        
        <div class="p-4 max-h-[600px] overflow-y-auto font-mono text-sm">
            {% for log in logs %}
            <div class="py-1 border-b border-slate-800 last:border-0 
                        {% if 'ERROR' in log %}text-red-400
                        {% elif 'WARNING' in log %}text-yellow-400
                        {% elif 'INFO' in log %}text-green-400
                        {% else %}text-slate-300{% endif %}">
                {{ log.strip() }}
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
