<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}University{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    {% if session.user_id %}
    <nav class="bg-white border-b border-slate-200 px-6 py-3 shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-8">
                <a href="{{ url_for('admin.dashboard') }}" class="text-xl font-bold text-blue-600">🎓 Воспитательная работа</a>
                <a href="{{ url_for('admin.dashboard') }}" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition">Дашборд</a>
                <a href="{{ url_for('directions.directions_list') }}" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition">Направления</a>
                <a href="{{ url_for('quotas.quotas_list') }}" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition">Квоты</a>
            </div>
            <a href="{{ url_for('auth.logout') }}" class="text-sm font-medium text-red-500 hover:text-red-600 transition">Выйти</a>
        </div>
    </nav>
    {% endif %}
    
    <main class="py-6">
        {% block content %}{% endblock %}
    </main>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="fixed bottom-4 right-4 space-y-2 z-50">
        {% for cat, msg in messages %}
        <div class="bg-slate-800 border border-slate-700 text-white px-4 py-3 rounded-lg shadow-lg text-sm flash-msg">{{ msg }}</div>
        {% endfor %}
    </div>
    <script>setTimeout(() => document.querySelectorAll('.flash-msg').forEach(e => e.remove()), 3000)</script>
    {% endif %}
    {% endwith %}
</body>
</html>
